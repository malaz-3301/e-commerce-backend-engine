spring.application.name=book-ecommerce-backend

server.servlet.context-path=/api

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/book_ecommerce}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.security.admin.username=${ADMIN_USERNAME:admin@example.com}
app.security.admin.password=${ADMIN_PASSWORD:admin123}
app.security.customer.username=${CUSTOMER_USERNAME:customer@example.com}
app.security.customer.password=${CUSTOMER_PASSWORD:customer123}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
